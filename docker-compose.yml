services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invictus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invictus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-invictus}
    ports:
      - "5432:5432"
    volumes:
      - invictus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invictus} -d ${POSTGRES_DB:-invictus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invictus}:${POSTGRES_PASSWORD:-invictus_dev_password}@db:5432/${POSTGRES_DB:-invictus}?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me-1c9f6b2a7e4d4f0b9a3c8e5d2f1b6a9c}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Invictus Padel Club <no-reply@invictuspadel.local>}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-directiva@invictuspadel.local}
    ports:
      - "3000:3000"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  invictus_pgdata:
